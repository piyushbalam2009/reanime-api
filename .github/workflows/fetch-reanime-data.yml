name: Fetch Re:ANIME data (no FlareSolverr)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which catalog data to fetch"
        required: true
        type: choice
        options:
          - search
          - details
          - episodes
        default: search
      query:
        description: "Anime search query (used in search mode)"
        required: false
        type: string
        default: "One Piece"
      anime_id:
        description: "Re:ANIME anime ID (required for details/episodes)"
        required: false
        type: string
      page:
        description: "Search page"
        required: false
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HTTP client
        run: python -m pip install "httpx>=0.27,<1"

      - name: Fetch public Re:ANIME catalog data
        env:
          FETCH_MODE: ${{ inputs.mode }}
          SEARCH_QUERY: ${{ inputs.query }}
          ANIME_ID: ${{ inputs.anime_id }}
          PAGE: ${{ inputs.page }}
          REANIME_BASE_URL: https://reanime.cz
        run: python scripts/fetch_reanime_data.py

      - name: Upload raw JSON response
        if: always() && hashFiles('artifacts/reanime-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: reanime-data
          path: artifacts/reanime-result.json
          if-no-files-found: error
          retention-days: 7
